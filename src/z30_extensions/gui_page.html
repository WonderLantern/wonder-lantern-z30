<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212a; --line: #2a2f3a; --line-2: #363c49;
    --text: #e8eaef; --muted: #8b93a3; --faint: #5d6575;
    --accent: #f2c94c; --accent-ink: #1b1607; --ok: #4fcf8a; --bad: #f06a6a; --info: #6aa8f0;
    --tip: #252a35; --locked: #6b5a22; --ok-line: #2c5d43; --bad-line: #6b3434; --stripe: #e0b73f;
    --radius: 12px; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e1e4ea; --line-2: #cdd2db;
    --text: #1b1f27; --muted: #5d6676; --faint: #8a92a1;
    --accent: #e0a800; --accent-ink: #1b1607; --ok: #1f9d5c; --bad: #d64545; --info: #2f7de1;
    --tip: #ffffff; --locked: #f0d88a; --ok-line: #9fd9b9; --bad-line: #efb4b4; --stripe: #f2c94c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
  body { user-select: none; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 18px 36px 36px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .header-right { display: flex; gap: 8px; }
  .tabs { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tab { background: transparent; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer;
    color: var(--muted); font-weight: 500; transition: background .15s, color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  .ghost { background: transparent; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 12px;
    cursor: pointer; color: var(--muted); }
  .ghost:hover { color: var(--text); border-color: var(--faint); }

  section { margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .head .n { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  .head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .plain .head { margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row label { color: var(--muted); font-size: 12.5px; white-space: nowrap; min-width: 84px; }
  .row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 12px; outline: none; user-select: text; }
  .plain .row input { background: var(--panel); }
  .row input:focus { border-color: var(--faint); }
  .btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 14px;
    cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.ok { color: var(--ok); } .pill.ok::before { background: var(--ok); }
  .pill.bad { color: var(--bad); } .pill.bad::before { background: var(--bad); }
  .pill.wait::before { background: var(--info); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  .file { font: 12px/1.4 "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; color: var(--muted); background: var(--bg);
    border: 1px dashed var(--line-2); border-radius: 6px; padding: 3px 8px; }
  .file em { font-style: normal; color: var(--text); }
  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .note { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .note.bad { color: var(--bad); }

  .everything { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin: 16px 0 8px; cursor: pointer; }
  .everything.on { border-color: var(--accent); }
  .everything .t { flex: 1; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .feat { display: flex; gap: 10px; align-items: flex-start; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .feat:hover { border-color: var(--line-2); }
  .feat.locked { cursor: default; }
  .feat .t { flex: 1; min-width: 0; }
  .feat b { display: block; font-weight: 600; font-size: 13.5px; }
  .feat code { font: 11.5px "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; color: var(--faint); }
  .sw { flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line-2); position: relative;
    transition: background .15s; margin-top: 1px; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: transform .15s, background .15s; }
  .on > .sw { background: var(--accent); }
  .on > .sw::after { transform: translateX(14px); background: var(--accent-ink); }
  .locked.on > .sw { background: var(--locked); }
  .summary { margin-top: 12px; color: var(--muted); font-size: 12.5px; }
  .summary.bad { color: var(--bad); }
  .tip { position: fixed; z-index: 10; max-width: 360px; background: var(--tip); border: 1px solid var(--line-2);
    border-radius: 9px; padding: 9px 11px; font-size: 12.5px; color: var(--text); pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); display: none; }

  .result { display: none; border-radius: 10px; border: 1px solid var(--line); padding: 14px 16px; margin-top: 14px;
    user-select: text; background: var(--bg); }
  .result.ok { display: block; border-color: var(--ok-line); }
  .result.bad { display: block; border-color: var(--bad-line); }
  .result h3 { margin: 0; font-size: 14px; flex: 1; }
  .result.ok h3 { color: var(--ok); } .result.bad h3 { color: var(--bad); }
  .result .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .result .kv { font: 12px/1.7 "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; color: var(--muted); word-break: break-all; }
  .result ol { margin: 10px 0 0; padding-left: 20px; }
  .result li { margin: 3px 0; }

  .go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 10px 22px;
    font-weight: 650; cursor: pointer; white-space: nowrap; min-width: 168px; }
  .go:hover { filter: brightness(1.06); }
  .go:disabled { filter: none; opacity: .55; cursor: default; }
  .go.busy { opacity: 1 !important; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--stripe) 10px 20px);
    background-size: 28px 28px; animation: slide .6s linear infinite; }
  @keyframes slide { to { background-position: 28px 0; } }
  .dropzone { border: 1.5px dashed var(--line-2); border-radius: 10px; background: var(--bg); padding: 18px 16px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--panel-2); }
  .dropzone .dz-title { font-weight: 600; font-size: 14px; }
  .dropzone .dz-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .examples span { color: var(--muted); font-size: 12.5px; }
  .btn.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
  .wave-wrap { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; height: 136px; margin-bottom: 12px; }
  .wave-wrap canvas { display: block; width: 100%; height: 100%; cursor: ew-resize; touch-action: none; }
  .wave-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 13px; pointer-events: none; }
  .ctrl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .ctrl-bar .spacer { flex: 1; }
  .mono-stat { font: 12px/1.4 "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
    color: var(--muted); }
  .mono-stat b { color: var(--text); font-weight: 600; }
  .mono-stat .warn { color: var(--bad); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .slider-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .slider-wrap input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .slider-wrap code { font: 12px "Cascadia Mono", Consolas, monospace; color: var(--text); min-width: 46px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
  .slot-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px;
    cursor: pointer; font: 12.5px "Cascadia Mono", Consolas, monospace; color: var(--muted); transition: border-color .15s; }
  .slot-btn:hover { border-color: var(--faint); color: var(--text); }
  .slot-btn.active { border-color: var(--accent); color: var(--text); background: var(--panel-2); font-weight: 600; }
  .btn:disabled { opacity: .48; cursor: default; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabBtnFirmware" data-tab="firmware" data-t="tab_firmware"></button>
      <button class="tab" id="tabBtnSound" data-tab="sound" data-t="tab_sound"></button>
    </div>
    <div class="header-right">
      <button class="ghost" id="theme"></button>
      <button class="ghost" id="lang"></button>
    </div>
  </header>

  <div class="tabpanel active" id="tabFirmware">
  <section class="plain">
    <div class="head"><h2 data-t="source"></h2></div>
    <div class="row">
      <input id="source" spellcheck="false">
      <button class="btn" id="pickSource" data-t="browse"></button>
    </div>
    <div class="pill" id="sourceState"></div>
  </section>

  <section class="card">
    <div class="head"><span class="n">01</span><h2 data-t="loader"></h2></div>
    <div class="row">
      <label data-t="out_folder"></label>
      <input id="loaderOut" spellcheck="false">
      <button class="btn" data-pick="loaderOut" data-t="browse"></button>
    </div>
    <div class="files"><span class="file">→ <em>EG209020.BIN</em></span><span class="file">→ <em>EG209020.json</em></span></div>
    <div class="note" data-t="loader_once"></div>
    <div class="actions"><button class="go" id="goLoader"></button></div>
    <div class="result" id="resultLoader"></div>
  </section>

  <section class="card">
    <div class="head"><span class="n">02</span><h2 data-t="patch"></h2></div>
    <div class="row">
      <label data-t="out_folder"></label>
      <input id="patchOut" spellcheck="false">
      <button class="btn" data-pick="patchOut" data-t="browse"></button>
    </div>
    <div class="files"><span class="file">→ <em>Z30/WL.PATCH</em></span></div>
    <div class="note" id="patchFor"></div>
    <div class="everything" id="everything"><div class="t" id="fullTitle"></div><div class="sw"></div></div>
    <div class="grid" id="grid"></div>
    <div class="summary" id="summary"></div>
    <div class="actions"><button class="go" id="goPatch"></button></div>
    <div class="result" id="resultPatch"></div>
  </section>
  </div>

  <div class="tabpanel" id="tabSound">
  <section class="card">
    <div class="head"><span class="n">01</span><h2 data-t="snd_pick"></h2></div>
    <input type="file" id="audioFile" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac,.opus,.webm" hidden>
    <div class="dropzone" id="dropzone">
      <div class="dz-title" data-t="snd_drop_title"></div>
      <div class="dz-sub" data-t="snd_drop_sub"></div>
    </div>
    <div class="examples">
      <span data-t="snd_examples"></span>
      <button class="btn sm" data-ex="1" data-t="snd_ex1"></button>
      <button class="btn sm" data-ex="2" data-t="snd_ex2"></button>
      <button class="btn sm" data-ex="3" data-t="snd_ex3"></button>
      <button class="btn sm" data-ex="4" data-t="snd_ex4"></button>
    </div>
    <div class="pill" id="soundSourceState"></div>
  </section>

  <section class="card">
    <div class="head"><span class="n">02</span><h2 data-t="snd_edit"></h2></div>
    <div class="wave-wrap">
      <canvas id="waveCanvas"></canvas>
      <div class="wave-empty" id="waveEmpty" data-t="snd_wave_empty"></div>
    </div>
    <div class="ctrl-bar">
      <button class="btn sm" id="btnAutoTrim" data-t="snd_autotrim" disabled></button>
      <button class="btn sm" id="btnResetRange" data-t="snd_reset" disabled></button>
      <span class="spacer"></span>
      <span class="mono-stat" id="soundStats"></span>
    </div>
    <div class="ctrl-bar">
      <label class="toggle"><input type="checkbox" id="sndNorm" checked><span data-t="snd_norm"></span></label>
      <label class="toggle"><input type="checkbox" id="sndFade" checked><span data-t="snd_fade"></span></label>
      <label class="slider-wrap">
        <span data-t="snd_gain"></span>
        <input type="range" id="sndGain" min="-12" max="12" step="0.5" value="0">
        <code id="sndGainVal">0 dB</code>
      </label>
      <span class="spacer"></span>
      <button class="btn sm" id="btnPlay8k" data-t="snd_play8k" disabled></button>
      <button class="btn sm" id="btnPlayOrig" data-t="snd_playorig" disabled></button>
    </div>
    <div class="note" data-t="snd_edit_note"></div>
  </section>

  <section class="card">
    <div class="head"><span class="n">03</span><h2 data-t="snd_export"></h2></div>
    <div class="row">
      <label data-t="out_folder"></label>
      <input id="soundOut" spellcheck="false">
      <button class="btn" data-pick="soundOut" data-t="browse"></button>
    </div>
    <div class="slots" id="soundSlots">
      <button class="slot-btn active" data-slot="root">SHUTTER.WAV</button>
      <button class="slot-btn" data-slot="1">SHUTTER/1.WAV</button>
      <button class="slot-btn" data-slot="2">SHUTTER/2.WAV</button>
      <button class="slot-btn" data-slot="3">SHUTTER/3.WAV</button>
      <button class="slot-btn" data-slot="4">SHUTTER/4.WAV</button>
    </div>
    <div class="ctrl-bar">
      <label class="toggle"><input type="checkbox" id="sndOverwrite"><span data-t="snd_overwrite"></span></label>
      <span class="spacer"></span>
      <button class="go" id="goSound" disabled></button>
    </div>
    <div class="result" id="resultSound"></div>
  </section>
  </div>
</div>
<div class="tip" id="tip"></div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let api, info, lang, states = {full: true}, check = 0, sourceKey = 'source_empty', running = null;
const results = {loader: null, patch: null};
let theme = (() => { try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; } })();
const systemLight = matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const light = theme === 'light' || (theme === 'auto' && systemLight.matches);
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
}
applyTheme();
systemLight.addEventListener('change', applyTheme);
const t = (k, v = {}) => TEXT[lang][k].replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');

function render() {
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('lang').textContent = t('switch'); $('theme').textContent = t('theme_' + theme);
  const full = !!states.full;
  $('everything').classList.toggle('on', full);
  $('fullTitle').textContent = info.titles[lang].full;
  $('grid').innerHTML = info.presets.filter(n => n !== 'full').map(n => {
    const locked = full, on = locked || !!states[n];
    return `<div class="feat ${on ? 'on' : ''} ${locked ? 'locked' : ''}" data-p="${n}">
      <div class="t"><b>${esc(info.titles[lang][n] || n)}</b><code>${n}</code></div><div class="sw"></div></div>`;
  }).join('');
  for (const [id, job] of [['goLoader', 'loader'], ['goPatch', 'patch']]) {
    const b = $(id);
    b.textContent = t(running === job ? 'building' : 'go_' + job);
    b.classList.toggle('busy', running === job); b.disabled = running !== null;
  }
  showSource(); showPatchFor(); summarize();
  for (const job in results) if (results[job]) showResult(job, results[job]);
  renderSound();
}

let folderKey = 'for_program', folderCheck = 0;
function showPatchFor() {
  const el = $('patchFor');
  el.className = 'note' + (folderKey === 'for_partial' ? ' bad' : '');
  el.textContent = t(folderKey);
}
async function checkPatchFolder() {
  const ticket = ++folderCheck;
  const r = await api.folder_state($('patchOut').value);
  if (ticket !== folderCheck) return;
  folderKey = {both: 'for_folder', partial: 'for_partial'}[r] || 'for_program'; showPatchFor();
}

async function summarize() {
  const r = await api.resolve(states);
  const el = $('summary');
  el.classList.toggle('bad', !r.ok);
  el.textContent = !r.ok ? r.error : r.features.length
    ? t('enabled', {n: r.features.length, list: r.features.map(n => info.titles[lang][n] || n).join(lang === 'zh' ? '、' : ', ')}) : t('none');
}

function showSource() {
  const el = $('sourceState');
  el.className = 'pill ' + ({source_ok: 'ok', source_bad: 'bad', source_missing: 'bad', source_wait: 'wait'}[sourceKey] || '');
  el.textContent = t(sourceKey);
}
async function checkSource() {
  const ticket = ++check; sourceKey = 'source_wait'; showSource();
  const r = await api.check_source($('source').value);
  if (ticket !== check) return;
  sourceKey = 'source_' + r; showSource();
}

function showResult(job, r) {
  results[job] = r;
  const el = $(job === 'loader' ? 'resultLoader' : 'resultPatch');
  if (!r.ok) {
    el.className = 'result bad';
    el.innerHTML = `<div class="top"><h3>${t('fail_title')}</h3></div><div>${esc(t(r.key, {d: r.detail || ''}))}</div>`;
    return;
  }
  const rows = r.files.map(esc).join('<br>')
    + (job === 'loader' ? `<br>SHA-256 ${esc(r.sha256)}` : '')
    + `<br>${t('resident_id')} ${r.resident_id}`
    + (job === 'patch' && r.resident_from ? ` · ${t('built_for_' + r.resident_from)}` : '')
    + (r.patch_bytes ? ` · WL.PATCH ${r.patch_bytes.toLocaleString()} ${t('bytes')}` : '');
  el.className = 'result ok';
  el.innerHTML = `<div class="top"><h3>${t('done')}</h3><button class="btn" data-open="${esc(r.folder)}">${t('open')}</button></div>
    <div class="kv">${rows}</div>
    <ol>${TEXT[lang]['steps_' + job].map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
  el.querySelector('[data-open]').onclick = e => api.open_folder(e.target.dataset.open);
}

async function build(job) {
  if (running) return;
  const field = job === 'loader' ? 'loaderOut' : 'patchOut';
  running = job; render();
  let r;
  try { r = await api.build(job, $('source').value, states, $(field).value); }
  catch (e) { r = {ok: false, key: 'failed', detail: String(e)}; }
  running = null;
  if (r.ok && job === 'loader') {
    // The card file belongs to the loader just built; the next loader goes to a fresh folder.
    $('patchOut').value = r.folder;
    $('loaderOut').value = await api.next_kit(r.folder);
    results.patch = null; $('resultPatch').className = 'result';
  } else if (r.ok && r.resident_from === 'program') {
    // Not tied to any loader folder: the next card file goes to a fresh folder.
    $('patchOut').value = await api.next_kit(r.folder);
  }
  await checkPatchFolder();
  render(); showResult(job, r);
}

// ---- Shutter sound processor (Web Audio API -> 8 kHz mono 16-bit PCM) ----
const MAX_SND_DUR = 1.08;
const SND_RATE = 8000;
const MAX_SND_SAMPLES = 8640;
let activeTab = 'firmware';
let audioCtx = null, sndBuf = null, sndMono = null, sndName = '', sndError = '';
let selStart = 0, selEnd = 0, sndSlot = 'root', sndSaving = false, sndResult = null, sndClipped = false;
let playSrc = null, playRaf = 0, playHead = -1;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function switchTab(tab) {
  activeTab = tab;
  $('tabBtnFirmware').classList.toggle('active', tab === 'firmware');
  $('tabBtnSound').classList.toggle('active', tab === 'sound');
  $('tabFirmware').classList.toggle('active', tab === 'firmware');
  $('tabSound').classList.toggle('active', tab === 'sound');
  if (tab === 'sound') requestAnimationFrame(drawWave);
}

function stopPlayback() {
  if (playSrc) { try { playSrc.stop(); } catch (e) {} playSrc = null; }
  if (playRaf) { cancelAnimationFrame(playRaf); playRaf = 0; }
  playHead = -1;
  drawWave();
}

function mixToMono(buf) {
  const len = buf.length, ch = buf.numberOfChannels, mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) {
    const data = buf.getChannelData(c);
    for (let i = 0; i < len; i++) mono[i] += data[i] / ch;
  }
  return mono;
}

function autoTrimSelection() {
  if (!sndBuf || !sndMono) return;
  const dur = sndBuf.duration, sr = sndBuf.sampleRate, len = sndMono.length;
  let peak = 0;
  for (let i = 0; i < len; i++) { const a = Math.abs(sndMono[i]); if (a > peak) peak = a; }
  if (peak < 1e-6) {
    selStart = 0; selEnd = Math.min(dur, MAX_SND_DUR);
  } else {
    const thr = peak * 0.025;
    let first = 0, last = len - 1;
    while (first < len && Math.abs(sndMono[first]) < thr) first++;
    while (last > first && Math.abs(sndMono[last]) < thr) last--;
    selStart = Math.max(0, first / sr - 0.005);
    selEnd = Math.min(dur, last / sr + 0.025);
    if (selEnd - selStart > MAX_SND_DUR) selEnd = selStart + MAX_SND_DUR;
    if (selEnd - selStart < 0.01) selEnd = Math.min(dur, selStart + 0.05);
  }
  sndClipped = false;
  renderSound();
}

function resetSelection() {
  if (!sndBuf) return;
  selStart = 0;
  selEnd = Math.min(sndBuf.duration, MAX_SND_DUR);
  sndClipped = false;
  renderSound();
}

async function loadAudioArrayBuffer(arrayBuf, name) {
  stopPlayback();
  sndError = ''; sndResult = null; $('resultSound').className = 'result';
  try {
    const ctx = getAudioCtx();
    const decoded = await ctx.decodeAudioData(arrayBuf.slice(0));
    if (!decoded || decoded.length === 0) throw new Error('Empty audio');
    sndBuf = decoded;
    sndMono = mixToMono(decoded);
    sndName = name;
    autoTrimSelection();
  } catch (e) {
    sndBuf = null; sndMono = null; sndName = '';
    sndError = String(e && e.message ? e.message : e);
    renderSound();
  }
}

function b64ToArrayBuffer(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}

function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function resampleSincFallback(mono, srcRate, startSec, targetLen) {
  const out = new Float32Array(targetLen);
  const ratio = srcRate / SND_RATE;
  const cutoff = Math.min(0.45, 0.45 / Math.max(1, ratio));
  const half = ratio > 1 ? Math.min(32, Math.ceil(8 * ratio)) : 8;
  for (let i = 0; i < targetLen; i++) {
    const center = (startSec + i / SND_RATE) * srcRate;
    const cInt = Math.floor(center);
    let acc = 0, wsum = 0;
    for (let k = -half; k <= half; k++) {
      const idx = cInt + k;
      if (idx < 0 || idx >= mono.length) continue;
      const x = idx - center;
      const w = 0.54 + 0.46 * Math.cos(Math.PI * x / (half + 1));
      const sinc = x === 0 ? 2 * cutoff : Math.sin(2 * Math.PI * cutoff * x) / (Math.PI * x);
      const coeff = w * sinc;
      acc += mono[idx] * coeff;
      wsum += coeff;
    }
    out[i] = wsum > 1e-8 ? acc / wsum : 0;
  }
  return out;
}

async function renderCanonicalPcm() {
  if (!sndBuf) throw new Error('No audio loaded');
  const segDur = Math.min(MAX_SND_DUR, Math.max(1 / SND_RATE, selEnd - selStart));
  const targetLen = Math.min(MAX_SND_SAMPLES, Math.max(1, Math.round(segDur * SND_RATE)));
  let samples;
  try {
    const offline = new OfflineAudioContext(1, targetLen, SND_RATE);
    const src = offline.createBufferSource();
    src.buffer = sndBuf;
    src.connect(offline.destination);
    src.start(0, selStart, segDur);
    const rendered = await offline.startRendering();
    samples = new Float32Array(rendered.getChannelData(0));
  } catch (e) {
    samples = resampleSincFallback(sndMono, sndBuf.sampleRate, selStart, targetLen);
  }
  if ($('sndNorm').checked) {
    let peak = 0;
    for (let i = 0; i < samples.length; i++) { const a = Math.abs(samples[i]); if (a > peak) peak = a; }
    if (peak > 1e-6) {
      const scale = 0.89125 / peak; // -1 dBFS
      for (let i = 0; i < samples.length; i++) samples[i] *= scale;
    }
  }
  const gainDb = parseFloat($('sndGain').value) || 0;
  if (gainDb !== 0) {
    const gain = Math.pow(10, gainDb / 20);
    for (let i = 0; i < samples.length; i++) samples[i] *= gain;
  }
  if ($('sndFade').checked && samples.length > 4) {
    const fadeIn = Math.min(16, Math.floor(samples.length / 4));
    const fadeOut = Math.min(40, Math.floor(samples.length / 4));
    for (let i = 0; i < fadeIn; i++) samples[i] *= i / fadeIn;
    for (let i = 0; i < fadeOut; i++) samples[samples.length - 1 - i] *= i / fadeOut;
  }
  const int16 = new Int16Array(samples.length);
  let clipped = 0;
  for (let i = 0; i < samples.length; i++) {
    let v = samples[i];
    if (v > 1 || v < -1) { clipped++; v = Math.max(-1, Math.min(1, v)); }
    int16[i] = Math.max(-32768, Math.min(32767, Math.round(v * 32767)));
  }
  sndClipped = clipped > 0;
  updateSoundStats();
  return {int16, clipped};
}

function animatePlayhead(startSec, durSec) {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  const tick = () => {
    const elapsed = ctx.currentTime - t0;
    if (elapsed >= durSec || !playSrc) { playHead = -1; playRaf = 0; drawWave(); return; }
    playHead = startSec + elapsed;
    drawWave();
    playRaf = requestAnimationFrame(tick);
  };
  playRaf = requestAnimationFrame(tick);
}

async function previewAudio(mode) {
  if (!sndBuf) return;
  stopPlayback();
  const ctx = getAudioCtx();
  if (mode === 'orig') {
    const dur = Math.max(0.005, selEnd - selStart);
    const src = ctx.createBufferSource();
    src.buffer = sndBuf;
    src.connect(ctx.destination);
    src.onended = () => { if (playSrc === src) { playSrc = null; playHead = -1; drawWave(); } };
    playSrc = src;
    src.start(0, selStart, dur);
    animatePlayhead(selStart, dur);
  } else {
    const {int16} = await renderCanonicalPcm();
    const buf = ctx.createBuffer(1, int16.length, SND_RATE);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < int16.length; i++) ch[i] = int16[i] / 32768;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.onended = () => { if (playSrc === src) { playSrc = null; playHead = -1; drawWave(); } };
    playSrc = src;
    src.start(0);
    animatePlayhead(selStart, int16.length / SND_RATE);
  }
}

function drawWave() {
  const canvas = $('waveCanvas');
  if (!canvas || !canvas.offsetWidth) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const colBg = cs.getPropertyValue('--bg').trim();
  const colLine = cs.getPropertyValue('--line').trim();
  const colMuted = cs.getPropertyValue('--faint').trim();
  const colAccent = cs.getPropertyValue('--accent').trim();
  const colText = cs.getPropertyValue('--text').trim();
  const colInfo = cs.getPropertyValue('--info').trim();

  g.fillStyle = colBg; g.fillRect(0, 0, w, h);
  g.strokeStyle = colLine; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  if (!sndBuf || !sndMono) return;

  const dur = sndBuf.duration || 1;
  const xStart = (selStart / dur) * w;
  const xEnd = (selEnd / dur) * w;

  // Dim unselected regions
  g.fillStyle = document.documentElement.dataset.theme === 'light' ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.42)';
  g.fillRect(0, 0, xStart, h);
  g.fillRect(xEnd, 0, w - xEnd, h);

  // Waveform bars
  const step = Math.max(1, Math.floor(sndMono.length / w));
  const mid = h / 2, amp = h * 0.44;
  for (let x = 0; x < w; x++) {
    const i0 = Math.floor((x / w) * sndMono.length);
    const i1 = Math.min(sndMono.length, i0 + step);
    let mn = 0, mx = 0;
    for (let i = i0; i < i1; i++) {
      const v = sndMono[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    const inSel = x >= xStart && x <= xEnd;
    g.fillStyle = inSel ? colText : colMuted;
    const yTop = mid - mx * amp, yBot = mid - mn * amp;
    g.fillRect(x, yTop, 1, Math.max(1, yBot - yTop));
  }

  // Selection borders & handles
  g.fillStyle = colAccent;
  g.fillRect(xStart - 1, 0, 2, h);
  g.fillRect(xEnd - 1, 0, 2, h);
  g.fillRect(Math.max(0, xStart - 5), 0, 10, 14);
  g.fillRect(Math.min(w - 10, xEnd - 5), h - 14, 10, 14);

  // Playhead
  if (playHead >= 0) {
    const xp = (playHead / dur) * w;
    g.fillStyle = colInfo;
    g.fillRect(xp - 1, 0, 2, h);
  }
}

function updateSoundStats() {
  const el = $('soundStats');
  if (!sndBuf) { el.textContent = ''; return; }
  const dur = Math.min(MAX_SND_DUR, Math.max(0, selEnd - selStart));
  const samples = Math.min(MAX_SND_SAMPLES, Math.max(1, Math.round(dur * SND_RATE)));
  const bytes = 44 + samples * 2;
  const base = t('snd_stats', {
    start: Math.round(selStart * 1000),
    end: Math.round(selEnd * 1000),
    dur: dur.toFixed(3),
    bytes: bytes.toLocaleString(),
  });
  el.innerHTML = esc(base) + (sndClipped ? `<span class="warn">${esc(t('snd_clipped'))}</span>` : '');
}

function showSoundResult(r) {
  sndResult = r;
  const el = $('resultSound');
  if (!r) { el.className = 'result'; return; }
  if (!r.ok) {
    el.className = 'result bad';
    el.innerHTML = `<div class="top"><h3>${t('fail_title')}</h3></div><div>${esc(t(r.key, {d: r.detail || ''}))}</div>`;
    return;
  }
  const meta = t('snd_done_meta', {dur: r.duration_ms, bytes: r.bytes.toLocaleString()});
  el.className = 'result ok';
  el.innerHTML = `<div class="top"><h3>${t('done')}</h3><button class="btn" data-open="${esc(r.folder)}">${t('open')}</button></div>
    <div class="kv">${esc(r.file)}<br>${esc(meta)}</div>
    <ol>${TEXT[lang].steps_sound.map(s => `<li>${esc(s.replace('{rel}', r.rel))}</li>`).join('')}</ol>`;
  el.querySelector('[data-open]').onclick = e => api.open_folder(e.target.dataset.open);
}

function renderSound() {
  const has = !!sndBuf;
  $('waveEmpty').style.display = has ? 'none' : 'flex';
  $('btnAutoTrim').disabled = !has;
  $('btnResetRange').disabled = !has;
  $('btnPlay8k').disabled = !has;
  $('btnPlayOrig').disabled = !has;
  const go = $('goSound');
  go.textContent = t(sndSaving ? 'saving_sound' : 'go_sound');
  go.classList.toggle('busy', sndSaving);
  go.disabled = !has || sndSaving;
  const st = $('soundSourceState');
  if (sndError) {
    st.className = 'pill bad';
    st.textContent = t('snd_decode_err', {d: sndError});
  } else if (has) {
    st.className = 'pill ok';
    st.textContent = t('snd_loaded', {
      name: sndName, dur: sndBuf.duration.toFixed(2),
      rate: sndBuf.sampleRate, ch: sndBuf.numberOfChannels,
    });
  } else {
    st.className = 'pill';
    st.textContent = t('snd_empty');
  }
  const gVal = parseFloat($('sndGain').value) || 0;
  $('sndGainVal').textContent = (gVal > 0 ? '+' : '') + gVal.toFixed(1).replace(/\.0$/, '') + ' dB';
  updateSoundStats();
  drawWave();
  if (sndResult) showSoundResult(sndResult);
}

async function exportSound() {
  if (!sndBuf || sndSaving) return;
  sndSaving = true; renderSound();
  let r;
  try {
    const {int16} = await renderCanonicalPcm();
    const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
    r = await api.save_sound($('soundOut').value, sndSlot, bytesToB64(bytes), $('sndOverwrite').checked);
  } catch (e) {
    r = {ok: false, key: 'sound_failed', detail: String(e)};
  }
  sndSaving = false;
  renderSound();
  showSoundResult(r);
}

function wireSound() {
  $('tabBtnFirmware').onclick = () => switchTab('firmware');
  $('tabBtnSound').onclick = () => switchTab('sound');
  const dz = $('dropzone'), fi = $('audioFile');
  dz.onclick = () => fi.click();
  fi.onchange = async () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    await loadAudioArrayBuffer(await f.arrayBuffer(), f.name);
    fi.value = '';
  };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = async e => {
    e.preventDefault(); dz.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) await loadAudioArrayBuffer(await f.arrayBuffer(), f.name);
  };
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
    const r = await api.example_sound(Number(b.dataset.ex));
    if (r && r.ok) await loadAudioArrayBuffer(b64ToArrayBuffer(r.data_b64), r.name);
  });
  $('btnAutoTrim').onclick = autoTrimSelection;
  $('btnResetRange').onclick = resetSelection;
  $('sndGain').oninput = () => { sndClipped = false; renderSound(); };
  $('sndNorm').onchange = () => { sndClipped = false; renderSound(); };
  $('sndFade').onchange = () => { sndClipped = false; renderSound(); };
  $('btnPlay8k').onclick = () => previewAudio('8k');
  $('btnPlayOrig').onclick = () => previewAudio('orig');
  $('soundSlots').onclick = e => {
    const b = e.target.closest('.slot-btn'); if (!b) return;
    sndSlot = b.dataset.slot;
    document.querySelectorAll('.slot-btn').forEach(x => x.classList.toggle('active', x === b));
  };
  $('goSound').onclick = exportSound;

  // Waveform dragging
  const canvas = $('waveCanvas');
  let dragMode = null, dragAnchor = 0, dragOrigStart = 0, dragOrigEnd = 0;
  const secFromEvent = e => {
    const rect = canvas.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
    return frac * (sndBuf ? sndBuf.duration : 0);
  };
  canvas.onpointerdown = e => {
    if (!sndBuf) return;
    const rect = canvas.getBoundingClientRect(), w = Math.max(1, rect.width), dur = sndBuf.duration;
    const x = e.clientX - rect.left;
    const xs = (selStart / dur) * w, xe = (selEnd / dur) * w;
    if (Math.abs(x - xs) <= 10) dragMode = 'start';
    else if (Math.abs(x - xe) <= 10) dragMode = 'end';
    else if (x > xs && x < xe) dragMode = 'move';
    else {
      const clickSec = secFromEvent(e);
      const span = Math.min(MAX_SND_DUR, selEnd - selStart || Math.min(dur, MAX_SND_DUR));
      selStart = Math.max(0, Math.min(dur - span, clickSec - span / 2));
      selEnd = Math.min(dur, selStart + span);
      dragMode = 'move';
    }
    dragAnchor = secFromEvent(e); dragOrigStart = selStart; dragOrigEnd = selEnd;
    canvas.setPointerCapture(e.pointerId);
    sndClipped = false; renderSound();
  };
  canvas.onpointermove = e => {
    if (!dragMode || !sndBuf) return;
    const dur = sndBuf.duration, cur = secFromEvent(e), minSpan = Math.min(dur, 0.01);
    if (dragMode === 'start') {
      selStart = Math.max(0, Math.min(dur - minSpan, cur));
      if (selEnd < selStart + minSpan) selEnd = Math.min(dur, selStart + minSpan);
      if (selEnd - selStart > MAX_SND_DUR) selEnd = Math.min(dur, selStart + MAX_SND_DUR);
    } else if (dragMode === 'end') {
      selEnd = Math.max(minSpan, Math.min(dur, cur));
      if (selStart > selEnd - minSpan) selStart = Math.max(0, selEnd - minSpan);
      if (selEnd - selStart > MAX_SND_DUR) selStart = Math.max(0, selEnd - MAX_SND_DUR);
    } else {
      const span = dragOrigEnd - dragOrigStart;
      const ns = Math.max(0, Math.min(dur - span, dragOrigStart + (cur - dragAnchor)));
      selStart = ns; selEnd = ns + span;
    }
    sndClipped = false; renderSound();
  };
  canvas.onpointerup = canvas.onpointercancel = () => { dragMode = null; };
  window.addEventListener('resize', () => { if (activeTab === 'sound') drawWave(); });
}

function wire() {
  $('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; render(); };
  $('theme').onclick = () => {
    theme = {auto: 'light', light: 'dark', dark: 'auto'}[theme];
    try { localStorage.setItem('theme', theme); } catch (e) {}
    applyTheme(); render();
  };
  $('source').oninput = checkSource;
  $('pickSource').onclick = async () => { const p = await api.choose_source(); if (p) { $('source').value = p; checkSource(); } };
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const field = $(b.dataset.pick), p = await api.choose_folder(field.value);
    if (p) { field.value = p; if (field.id === 'patchOut') checkPatchFolder(); }
  });
  $('patchOut').oninput = checkPatchFolder;
  $('goLoader').onclick = () => build('loader');
  $('goPatch').onclick = () => build('patch');
  $('everything').onclick = () => { states.full = !states.full; render(); };
  $('grid').onclick = e => {
    const f = e.target.closest('.feat'); if (!f || f.classList.contains('locked')) return;
    states[f.dataset.p] = !states[f.dataset.p]; render();
  };
  const tip = $('tip');
  document.addEventListener('mousemove', e => {
    const f = e.target.closest('.feat, .everything');
    const label = f && info.labels[lang][f.dataset.p || 'full'];
    if (!label) { tip.style.display = 'none'; return; }
    tip.textContent = label;
    tip.style.display = 'block';
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10);
    const y = e.clientY + 18 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 12 : e.clientY + 18;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
}

async function start(bridge) {
  api = bridge;
  info = await api.initial();
  lang = info.language;
  $('source').value = info.source;
  $('loaderOut').value = info.outputs.loader; $('patchOut').value = info.outputs.patch;
  $('soundOut').value = info.outputs.sound || '';
  wire(); wireSound(); render(); checkSource(); checkPatchFolder();
}

      : {ok: true, folder: dir + 'card', files: [dir + 'card/Z30/WL.PATCH'], resident_id: '0x67f308e7', patch_bytes: 409864,
         resident_from: 'program'},
    next_kit: async () => dir + 'card-2', open_folder: async () => {}, choose_source: async () => null,
    folder_state: async () => 'none',
    choose_folder: async () => null,
    example_sound: async slot => ({ok: false, key: 'sound_failed', detail: 'Preview mode'}),
    save_sound: async (folder, slot, pcmB64) => {
