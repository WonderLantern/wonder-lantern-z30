# Builds the Windows packaging tool (WonderLanternZ30-windows-x64.zip: the GUI
# that packs the loader EG and the WL.PATCH card file, with Keystone inside),
# checks the packaged program and attaches it to the GitHub release of the tag.
# The release version (the tag) is stamped into the program and shown on the
# status page of every card file it builds.
#
# The stock firmware is never stored in the repository or uploaded anywhere by
# this workflow. It is fetched from Nikon's official download server; the
# repository secret Z30_FIRMWARE_URL, when set, overrides that URL and may serve
# Z_30_0120.bin directly or a .zip that contains it. The SHA-256 is checked
# before anything is built.
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (leave empty to only build an Actions artifact)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FIRMWARE_SHA256: 1a5449ef505f1f347ed4e066a6a3f588ea542240680e83f4ebcae3b16da3434a
  FIRMWARE_SIZE: 34496798

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install '.[gui-exe,verify]'

      - name: Restore stock firmware cache
        id: firmware-cache
        uses: actions/cache@v4
        with:
          path: Z_30_0120.bin
          key: z30-firmware-${{ env.FIRMWARE_SHA256 }}

      - name: Download stock firmware
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        env:
          FIRMWARE_URL: ${{ secrets.Z30_FIRMWARE_URL || 'https://download.nikonimglib.com/archive7/0tErF003na2o07Cel9919YVUzB70/Z_30_0120.bin' }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'firmware-download'
          Invoke-WebRequest -Uri $env:FIRMWARE_URL -OutFile $download
          $bytes = [IO.File]::ReadAllBytes($download)
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            $unpacked = Join-Path $env:RUNNER_TEMP 'firmware-unpacked'
            Expand-Archive -Path $download -DestinationPath $unpacked -Force
            $found = Get-ChildItem $unpacked -Recurse -Filter 'Z_30_0120.bin' | Select-Object -First 1
            if (-not $found) { throw 'Z_30_0120.bin not found in the downloaded archive' }
            Copy-Item $found.FullName Z_30_0120.bin
          } else {
            Copy-Item $download Z_30_0120.bin
          }

      - name: Verify stock firmware
        run: |
          $file = Get-Item Z_30_0120.bin
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($file.Length -ne [int64]$env:FIRMWARE_SIZE -or $hash -ne $env:FIRMWARE_SHA256) {
            throw "Unexpected firmware: $($file.Length) bytes, SHA-256 $hash"
          }
          "Firmware OK: $hash"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The tag on tag pushes and on manual runs that name one; otherwise the commit.
      - name: Program version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $version = if ($env:TAG) { $env:TAG } else { git rev-parse --short=7 HEAD }
          "value=$version" >> $env:GITHUB_OUTPUT
          "Program version: $version"

      - name: Build packaging tool
        run: python tools/build_gui_exe.py --version '${{ steps.version.outputs.value }}'

      # The packaged program builds the loader EG and a full card file without a
      # window; its loader EG must equal the one built from source.
      - name: Check packaged program
        id: sums
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'selftest'
          $exe = 'dist/WonderLanternZ30/WonderLanternZ30.exe'
          $firmware = (Resolve-Path Z_30_0120.bin).Path
          # A windowed exe: Start-Process -Wait is what waits for it to exit.
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest', $firmware, $check -PassThru -Wait
          $report = Get-Content (Join-Path $check 'selftest.json') -Raw
          $report
          if ($run.ExitCode) { throw "Packaged program selftest failed ($($run.ExitCode))" }
          $result = $report | ConvertFrom-Json
          $loaderDir = $result[0].folder
          $patchFile = $result[1].patch
          $loaderHash = (Get-FileHash (Join-Path $loaderDir 'EG209020.BIN') -Algorithm SHA256).Hash.ToLower()
          $patchHash = (Get-FileHash $patchFile -Algorithm SHA256).Hash.ToLower()

          $source = Join-Path $env:RUNNER_TEMP 'source-card'
          python patch.py full --card --source Z_30_0120.bin --output $source
          if ($LASTEXITCODE) { throw 'source card build failed' }
          $sourceHash = (Get-FileHash (Join-Path $source 'EG209020.BIN') -Algorithm SHA256).Hash.ToLower()
          if ($sourceHash -ne $loaderHash) { throw "Loader EG differs: packaged $loaderHash, source $sourceHash" }

          $zip = 'dist/WonderLanternZ30-windows-x64.zip'
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "zip=$zipHash" >> $env:GITHUB_OUTPUT
          "loader=$loaderHash" >> $env:GITHUB_OUTPUT
          @"
          ## ${{ steps.version.outputs.value }}
          | File | SHA-256 |
          | --- | --- |
          | WonderLanternZ30-windows-x64.zip | ``$zipHash`` |
          | Loader EG209020.BIN | ``$loaderHash`` |
          | full Z30/WL.PATCH (selftest, dated today) | ``$patchHash`` |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: WonderLanternZ30-windows-x64-${{ steps.version.outputs.value }}
          path: dist/WonderLanternZ30-windows-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.value }}
          ZIP_SHA: ${{ steps.sums.outputs.zip }}
          LOADER_SHA: ${{ steps.sums.outputs.loader }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE) {
            # New releases start as drafts so the notes can be written before publishing.
            $notes = "``WonderLanternZ30-windows-x64.zip`` SHA-256:`n`n``$env:ZIP_SHA```n`n" +
                     "Loader ``EG209020.BIN`` SHA-256 (the same from the program and from source):`n`n``$env:LOADER_SHA``"
            gh release create $env:TAG --draft --verify-tag --title "Wonder Lantern Z30 $env:TAG" --notes $notes
            if ($LASTEXITCODE) { throw 'gh release create failed' }
          }
          gh release upload $env:TAG dist/WonderLanternZ30-windows-x64.zip --clobber
          if ($LASTEXITCODE) { throw 'gh release upload failed' }
