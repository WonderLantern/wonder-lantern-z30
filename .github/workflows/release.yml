# Builds the packaging tool (the GUI that packs the loader EG and the WL.PATCH
# card file, with Keystone inside) for Windows, Linux and macOS, checks each
# packaged program and attaches them to the GitHub release of the tag:
#
#   WonderLanternZ30-windows-x64.zip
#   WonderLanternZ30-linux-x64.tar.gz
#   WonderLanternZ30-macos-x64.zip     (x86_64; Apple silicon runs it through Rosetta 2)
#
# The release version (the tag) is stamped into the program and shown on the
# status page of every card file it builds.
#
# The stock firmware is never stored in the repository or uploaded anywhere by
# this workflow. It is fetched from Nikon's official download server; the
# repository secret Z30_FIRMWARE_URL, when set, overrides that URL and may serve
# Z_30_0120.bin directly or a .zip that contains it. The SHA-256 is checked
# before anything is built.
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (leave empty to only build Actions artifacts)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FIRMWARE_SHA256: 1a5449ef505f1f347ed4e066a6a3f588ea542240680e83f4ebcae3b16da3434a
  FIRMWARE_SIZE: 34496798

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tests: true
          # The oldest supported Ubuntu, so the program runs on older glibc too.
          - os: ubuntu-22.04
            tests: false
          # keystone-engine 0.9.2 has macOS wheels for x86_64 only.
          - os: macos-15-intel
            tests: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      # Qt's X11 platform plugin links these; installed here they are bundled into
      # the Linux program, so users need only a desktop with NSS (libnss3).
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbfile1 libnss3

      - name: Install dependencies
        run: python -m pip install '.[gui-exe,verify]'

      - name: Restore stock firmware cache
        id: firmware-cache
        uses: actions/cache@v4
        with:
          path: Z_30_0120.bin
          key: z30-firmware-${{ env.FIRMWARE_SHA256 }}
          enableCrossOsArchive: true

      - name: Download stock firmware
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        env:
          FIRMWARE_URL: ${{ secrets.Z30_FIRMWARE_URL || 'https://download.nikonimglib.com/archive7/0tErF003na2o07Cel9919YVUzB70/Z_30_0120.bin' }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'firmware-download'
          Invoke-WebRequest -Uri $env:FIRMWARE_URL -OutFile $download
          $bytes = [IO.File]::ReadAllBytes($download)
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            $unpacked = Join-Path $env:RUNNER_TEMP 'firmware-unpacked'
            Expand-Archive -Path $download -DestinationPath $unpacked -Force
            $found = Get-ChildItem $unpacked -Recurse -Filter 'Z_30_0120.bin' | Select-Object -First 1
            if (-not $found) { throw 'Z_30_0120.bin not found in the downloaded archive' }
            Copy-Item $found.FullName Z_30_0120.bin
          } else {
            Copy-Item $download Z_30_0120.bin
          }

      - name: Verify stock firmware
        run: |
          $file = Get-Item Z_30_0120.bin
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($file.Length -ne [int64]$env:FIRMWARE_SIZE -or $hash -ne $env:FIRMWARE_SHA256) {
            throw "Unexpected firmware: $($file.Length) bytes, SHA-256 $hash"
          }
          "Firmware OK: $hash"

      # The unit tests are the same on every system; they run once, on Windows.
      - name: Run tests
        if: matrix.tests
        run: python -m unittest discover -s tests -v

      # The tag on tag pushes and on manual runs that name one; otherwise the commit.
      - name: Program version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $version = if ($env:TAG) { $env:TAG } else { git rev-parse --short=7 HEAD }
          "value=$version" >> $env:GITHUB_OUTPUT
          "Program version: $version"

      - name: Build packaging tool
        run: python tools/build_gui_exe.py --version '${{ steps.version.outputs.value }}'

      # The packaged program builds the loader EG, a full card file for it and a
      # full card file without a loader folder (it must be the same bytes), with
      # no window; its loader EG must equal the one built from source.
      - name: Check packaged program
        id: sums
        run: |
          $build = Get-Content dist/build.json -Raw | ConvertFrom-Json
          $check = Join-Path $env:RUNNER_TEMP 'selftest'
          $firmware = (Resolve-Path Z_30_0120.bin).Path
          # The Windows exe is windowed: Start-Process -Wait is what waits for it to exit.
          $run = Start-Process -FilePath $build.program -ArgumentList '--selftest', $firmware, $check -PassThru -Wait
          $report = Get-Content (Join-Path $check 'selftest.json') -Raw
          $report
          if ($run.ExitCode) { throw "Packaged program selftest failed ($($run.ExitCode))" }
          $result = $report | ConvertFrom-Json
          $loaderDir = $result[0].folder
          $patchFile = $result[1].patch
          $loaderHash = (Get-FileHash (Join-Path $loaderDir 'EG209020.BIN') -Algorithm SHA256).Hash.ToLower()
          $patchHash = (Get-FileHash $patchFile -Algorithm SHA256).Hash.ToLower()

          $source = Join-Path $env:RUNNER_TEMP 'source-card'
          python patch.py full --card --source Z_30_0120.bin --output $source
          if ($LASTEXITCODE) { throw 'source card build failed' }
          $sourceHash = (Get-FileHash (Join-Path $source 'EG209020.BIN') -Algorithm SHA256).Hash.ToLower()
          if ($sourceHash -ne $loaderHash) { throw "Loader EG differs: packaged $loaderHash, source $sourceHash" }

          $archive = Get-Item $build.archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "archive=$($archive.Name)" >> $env:GITHUB_OUTPUT
          "loader=$loaderHash" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force sums | Out-Null
          "$archiveHash  $($archive.Name)" | Set-Content "sums/$($archive.Name).sha256"
          "$loaderHash" | Set-Content "sums/loader-$($build.system).sha256"
          @"
          ## ${{ steps.version.outputs.value }} ($($build.system)-$($build.arch))
          | File | SHA-256 |
          | --- | --- |
          | $($archive.Name) | ``$archiveHash`` |
          | Loader EG209020.BIN | ``$loaderHash`` |
          | full Z30/WL.PATCH (selftest, dated today) | ``$patchHash`` |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sums.outputs.archive }}-${{ steps.version.outputs.value }}
          path: |
            dist/${{ steps.sums.outputs.archive }}
            sums/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $archives = @(Get-ChildItem artifacts/dist -File)
          if ($archives.Count -ne 3) { throw "Expected 3 programs, got: $($archives.Name -join ', ')" }
          $loaders = @(Get-ChildItem artifacts/sums -Filter 'loader-*.sha256' | ForEach-Object { (Get-Content $_).Trim() } | Sort-Object -Unique)
          if ($loaders.Count -ne 1) { throw "Loader EG differs between systems: $loaders" }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE) {
            # New releases start as drafts so the notes can be written before publishing.
            $sums = @{}
            Get-ChildItem artifacts/sums -Filter 'WonderLanternZ30-*.sha256' | ForEach-Object {
              $hash, $name = (Get-Content $_).Trim() -split '\s+', 2
              $sums[$name] = $hash
            }
            $rows = @(
              @('Windows 10/11', 'WonderLanternZ30-windows-x64.zip'),
              @('Linux x86-64', 'WonderLanternZ30-linux-x64.tar.gz'),
              @('macOS 11+ (Intel; Apple silicon via Rosetta 2)', 'WonderLanternZ30-macos-x64.zip')
            ) | ForEach-Object { "| $($_[0]) | ``$($_[1])`` | ``$($sums[$_[1]])`` |" }
            $tick = '`'
            $docs = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:TAG/docs"
            @(
              '## 下载 / Downloads', '',
              '| 系统 / System | 文件 / File | SHA-256 |', '| --- | --- | --- |', $rows, '',
              "加载器 / Loader ${tick}EG209020.BIN${tick} SHA-256（三个程序和源码构建相同 / the same from all three programs and from source）:", '',
              "$tick$($loaders[0])$tick", '',
              "图文教程 / Tutorial: [中文]($docs/gui-tutorial.md) · [English]($docs/gui-tutorial.en.md)"
            ) | Set-Content notes.md
            gh release create $env:TAG --draft --verify-tag --title "Wonder Lantern Z30 $env:TAG" --notes-file notes.md
            if ($LASTEXITCODE) { throw 'gh release create failed' }
          }
          gh release upload $env:TAG @($archives.FullName) --clobber
          if ($LASTEXITCODE) { throw 'gh release upload failed' }
